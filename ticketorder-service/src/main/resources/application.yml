server:
  port: 8090

spring:
  application:
    name: ticketorder-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketorder_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ticketwave:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSecretKeyInProductionToASecureRandomValueOfAtLeast32BytesLong}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  order-ttl-minutes: ${ORDER_TTL_MINUTES:15}
  monolith:
    base-url: ${MONOLITH_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.ticketwave: DEBUG
