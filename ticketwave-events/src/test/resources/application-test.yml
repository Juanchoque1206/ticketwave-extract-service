spring:
  datasource:
    url: jdbc:h2:mem:ticketwave_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cache:
    type: simple

ticketwave:
  jwt:
    secret: TestOnlySecretKeyThatIsAtLeastThirtyTwoBytesLongForTests
    expiration-ms: 3600000
  order-ttl-minutes: 15
  internal-token: test-internal-token
  order-service:
    base-url: http://localhost:8090
  saga:
    recovery-enabled: false