server:
  port: 8085

spring:
  application:
    name: ticketwave-orchestrator
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false

ticketwave:
  saga:
    recovery-enabled: ${SAGA_RECOVERY_ENABLED:true}
    recovery-interval-ms: ${SAGA_RECOVERY_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.ticketwave: DEBUG
